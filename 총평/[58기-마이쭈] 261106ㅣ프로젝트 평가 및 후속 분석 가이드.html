# 시각화 프로젝트 총평과 후속 분석 방향

Steam 게임 특성별 가격과 플레이타임의 관계

<div class="mt-10 px-4 py-3 border-l-4 border-[var(--gold)] bg-white/10 text-sm leading-relaxed text-white/85">
<div class="font-bold text-[var(--gold)] mb-1">읽기 전에</div>
이 자료에는 아직 배우지 않은 추론통계와 회귀분석 내용이 들어 있어, 지금은 이해하기 어려운 부분이 있을 수 있습니다. 앞으로의 진도를 익힌 뒤 후속 분석에 참고하기 바랍니다.

## 총평

### 잘된 부분

- 핵심 질문 Q1·Q2에서 그래프, 결론, 한계로 이어지는 흐름이 처음부터 끝까지 일관됩니다.
- 보고서의 수치가 노트북 출력과 맞고, 그래프마다 게임 수·중앙값·IQR 표를 함께 제시했습니다.
- 한 게임이 여러 장르에 속하는 문제를 스스로 찾아내, 중복된 817개를 뺀 기준으로 RPG와 Action을 다시 비교했습니다.
- 빗나간 예상 ①·②를 감추지 않고 그대로 판정했습니다.

### 한계점

- 플레이타임에 영향을 줄 수 있는 요인들이 서로 함께 움직였습니다. 비싼 게임일수록 DLC가 있는 게임과 도전과제가 많은 게임의 비율도 높았습니다.
- 그래프는 "가격대 × DLC", "가격대 × 도전과제"처럼 두 변수씩만 비교해서, 플레이타임이 길어진 이유가 어느 요인 때문인지 가를 수 없습니다.
  - 비싼 식당일수록 코스 요리가 많아 식사 시간이 길 때, 그 이유가 가격인지 코스인지 모르는 것과 같습니다.
- 출시 시기에 따른 누적 기간 차이도 한계로만 적었고, 비교할 때 걸러 내지는 못했습니다.

이 한계는 그래프를 더 그려서는 풀리지 않습니다.

플레이타임에 영향을 줄 수 있는 요인끼리도 서로 함께 움직입니다. 가격대가 오를수록 DLC와 도전과제도 함께 늘어납니다.

## 변수 설계

플레이타임에 영향을 줄 수 있는 요인 6가지를 독립변수로 넣습니다.

| 구분 | 변수 | 유형 | 내용 |
| --- | --- | --- | --- |
| 종속 | 플레이타임 | 연속형 | \`median_playtime\`에 로그를 씌워 사용함. |
| 독립 | 가격대 | 범주형 | 무료·0~5달러·5~10달러·10~20달러·20달러 이상의 5구간임. |
| 독립 | DLC 유무 | 범주형 | 있음·없음임. |
| 독립 | 도전과제 구간 | 범주형 | 0개·1~20개·21~40개·41개 이상의 4구간임. |
| 독립 | 장르 | 범주형 | • 장르 10개를 각각 0/1 열로 넣음.<br>• 한 게임이 여러 장르에 1을 가질 수 있어 중복 집계 문제가 없음. |
| 독립 | 출시 후 경과 개월 수 | 연속형 | 원본 \`release_date\`로 새로 만듦. |
| 독립 | 리뷰 수 | 연속형 | 인기도를 나타내며, 원본에서 새로 가져옴. |

## 분석 조건

### 조건 1. 데이터 보완

출시일과 리뷰 수를 원본에서 다시 가져와야 합니다.

### 조건 2. 로그 변환

플레이타임은 몇 분부터 수십만 분까지 퍼져 있어서, 그대로 쓰면 모델이 거의 아무것도 설명하지 못합니다. 로그를 씌워 "몇 배 차이인가"로 바꿔 써야 합니다.

> 로그변환에 대해서는 선형회귀 단원에서 자세히 학습하기 바랍니다.

### 조건 3. 해석 범위

회귀분석의 결과는 "이런 특성을 가진 게임은 플레이타임이 이렇다"는 경향까지만 말해 줍니다.

- 말할 수 있는 것: "다른 조건이 같을 때, 20달러 이상 게임은 무료 게임보다 플레이타임이 긴 경향이 있다."
- 말할 수 없는 것: "게임 가격을 올리면 플레이타임이 늘어난다."
- 이 데이터는 이미 팔리고 있는 게임들을 관찰한 것이지, 같은 게임의 가격만 바꿔 본 실험이 아닙니다.

페이지 마지막 불릿의 `살인은 104건에서 149건까지 급증`과도 어긋납니다.\n\n**→ 사회적 거리두기 기간 `2020.02.~2023.04.`를 출처로 확인해 고치고, 두 불릿의 시점을 맞추세요.**\n\n- 노트북: `261104 분석노트북` 셀 51(Q3 그래프 해석)입니다.\n- 정부가 사회적 거리두기를 전면 해제한 날은 `2022년 4월 18일`입니다.\n- 거리두기가 `2023.04.`까지라면 `해제 직후 2년 이내 104건(2022년) → 149건(2024년)`의 출발점인 2022년은 거리두기 기간 안이라 문장이 성립하지 않습니다.\n\n**→ `외부활동의 제한이 살인·강도 등에 단기적, 직접적인 영향을 미친 것으로 볼 수 있음`을 `거리두기 기간과 발생 건수 변화의 시점이 겹친다`는 수위로 낮추세요.**\n\n- 노트북: `261104 분석노트북` 셀 51(Q3 그래프 해석)입니다.\n- 이 보고서의 그래프는 연도별 건수만 보여 주고 외부활동 감소가 범죄를 줄였는지는 확인하지 않았습니다.\n- 해석을 유지하려면 참고문헌의 `노성훈·김병민(2022)` 같은 선행연구를 이 문장에 인용하세요.\n\n---\n\n## p.16 서울시 범죄 발생 현황(자치구별 – 전체)\n\n**→ 지도와 표의 양천구 `3,918`을 원자료 값으로 고치세요.**\n\n- 노트북: `261104 분석노트북` 셀 69(2025 총계 지도 이미지)입니다. 값은 이미지 안에만 있습니다.\n- 히트맵 값으로 더하면 양천구 2025년 5대 범죄는 `2,990`건입니다.\n- 지금은 마포구와 양천구가 모든 범죄 유형에서 똑같은 값입니다.\n\n**→ 기술통계 표를 이 페이지 자치구 표의 값으로 다시 계산하세요.**\n\n- 노트북: 노트북에는 해당 셀이 없습니다. 기술통계 표는 보고서에서 처음 나왔습니다.\n- 표의 25개 값으로 계산하면 mean은 `3,065.04`가 아니라 `3,072.24`, std는 `981.82`가 아니라 `1,015.86`입니다.\n- p.17~27의 기술통계 표도 모두 mean이 자치구 표와 맞지 않으므로 같은 데이터로 다시 뽑으세요.\n- 기술통계 표는 바로 옆 자치구 표를 요약한 숫자라서 두 표가 다르면 독자는 어느 쪽이 맞는지 판단할 수 없습니다.\n\n**→ 부제의 `유흥업소 및 유동인구 밀집 지역인 강남권`을 `강남구·송파구·영등포구`처럼 확인한 사실만 남기고, 원인은 해석으로 나눠 쓰세요.**\n\n- 노트북: `261104 분석노트북` 셀 104(분석 결과 Q4의 `유흥업소나 무인점포의 분포`)입니다.\n- 유흥업소 수와 유동인구는 이 보고서에서 수집하지 않은 자료라 그래프로 보여 줄 수 없습니다.\n\n---\n\n## p.17 서울시 범죄 발생 현황(자치구별 - 살인)\n\n**→ 기술통계 표의 mean `5.08`을 자치구 표 값으로 다시 계산하세요.**\n\n- 노트북: 노트북에는 해당 셀이 없습니다. 살인은 셀 60의 지도 이미지뿐입니다.\n- 자치구 표의 합은 `124`이므로 mean은 `4.96`입니다.\n\n---\n\n## p.18 서울시 범죄 발생 현황(자치구별 - 강도)\n\n**→ 기술통계 표의 mean `3.44`를 자치구 표 값으로 다시 계산하세요.**\n\n- 노트북: 노트북에는 해당 셀이 없습니다. 강도는 셀 57의 지도 이미지뿐입니다.\n- 자치구 표의 합은 `89`이므로 mean은 `3.56`입니다.\n\n---\n\n## p.19 서울시 범죄 발생 현황(자치구별 - 강간·강제추행)\n\n**→ 표의 `전체 6,407`을 고치세요.**\n\n- 노트북: 노트북에는 해당 셀이 없습니다. 자치구 표는 보고서에서 처음 나왔습니다.\n- 자치구 표 25개를 더하면 `6,007`이고 p.15의 2025년 값도 `6,007`입니다(p.15 ↔ p.19).\n- 양천구를 히트맵 값 `101`로 고치면 합계는 `5,619`가 됩니다.\n\n**→ 양천구를 고친 뒤 부제·불릿의 `마포구와 양천구가 각 489건`과 `남부권역과 북부권역의 대비`를 다시 쓰세요.**\n\n- 노트북: `261104 분석노트북` 셀 55(2025 강간 지도 해석)입니다.\n- 양천구가 `101`이면 2위권에서 빠지고, 2위 마포구는 한강 북쪽이라 '남부 대 북부' 구도가 성립하지 않습니다.\n\n**→ 제목 `유흥 상권 밀집 지역 중심`을 그래프가 보여 주는 사실(예: `강남구에 가장 많이 발생`)로 바꾸세요.**\n\n- 노트북: 노트북에는 해당 셀이 없습니다.\n- 유흥 상권의 분포는 이 보고서에 없는 자료입니다.\n\n---\n\n## p.20 서울시 범죄 발생 현황(자치구별 - 절도)\n\n**→ 🚨 표의 서대문구·서초구·성동구·성북구 값을 지도 값으로 고치세요.**\n\n- 노트북: 표는 노트북에 없습니다. 불릿의 `서초구(1,838건)`은 `261104 분석노트북` 셀 64(2025 절도 지도 해석)입니다.\n- 지도에는 `서대문구 900 · 서초구 1,838 · 성동구 766 · 성북구 755`인데, 표에는 p.21 폭력 표의 값 `848 · 1,758 · 958 · 1,103`이 들어가 있습니다.\n- 그래서 표의 전체 `33,274`가 p.15의 2025년 절도 `32,866`과 다릅니다(p.15 ↔ p.20).\n- 아래 불릿의 `서초구(1,838건)`와 `성북, 성동도 낮은 발생 규모`는 지도 값 기준이라 표와 어긋납니다.\n\n**→ 부제의 `범죄로부터 상대적으로 안전한 것으로 나타남`을 `절도 발생 건수가 적었음`으로 바꾸세요.**\n\n- 노트북: 노트북에는 해당 셀이 없습니다.\n- 인구·면적을 고려하지 않은 건수라 '안전하다'까지는 말할 수 없습니다.\n  - 이 한계는 p.16·21 불릿과 p.34에도 이미 적혀 있습니다.\n\n---\n\n## p.21 서울시 범죄 발생 현황(자치구별 - 폭력)\n\n**→ 양천구 `2,150`을 원자료 값으로 고치고, 부제와 첫 불릿의 `마포구, 양천구 2,000건 이상`을 다시 쓰세요.**\n\n- 노트북: `261104 분석노트북` 셀 67(2025 폭력 지도 해석)입니다.\n- 히트맵의 양천구 2025년 폭력은 `1,384`라 2,000건 이상에 들지 않습니다.\n\n---\n\n## p.23 서울시 범죄 발생 현황 (Heatmap) – 절도, 폭력\n\n**→ 강남구 폭력의 `연간 약 3,100~3,700건`을 `약 3,150~3,760건`으로 고치세요.**\n\n- 노트북: 노트북에는 해당 문장이 없습니다. 값은 `261104 분석노트북` 셀 97(폭력 피벗 표)에 있습니다.\n- 히트맵의 2022년 값이 `3,762`라 3,700을 넘습니다.\n\n---\n\n## p.24 서울시 생활안전 시설물 현황 – CCTV 카메라\n\n**→ 🚨 부제의 `설치위치가 가장 많은 자치구는 강북구`를 `서초구`로 고치세요.**\n\n- 노트북: `261104 분석노트북` 셀 26(CCTV 지도 해석)은 `양천구에 CCTV 설치가 가장 집중`이라고 적었습니다. `강북구`는 보고서에서 처음 나왔습니다.\n- 표에서 설치개소 수는 서초구 `5,032` > 영등포구 `4,831` > 양천구 `4,790` > 강북구 `4,467` 순입니다.\n- 기술통계 표의 max도 `5,032`입니다.\n\n**→ 노원구·도봉구·강북구·광진구의 `카메라 대수 = 설치개소 수`가 원자료 그대로인지 확인하세요.**\n\n- 노트북: `261103 CCTV 및 비상벨 전처리(2차)` 셀 33(`카메라대수` 열 추출)까지만 있습니다. 자치구별 대수·개소를 집계한 셀은 없습니다.\n- 네 구만 한 개소에 정확히 1대씩 있다는 뜻이라 대수를 기록하지 않은 자료일 수 있습니다.\n  - 그렇다면 네 구의 카메라 대수가 실제보다 적게 잡혀 `광진구 1,156개로 가장 적음`이 달라질 수 있으니, 한계에 적으세요.\n\n**→ 기술통계 표를 자치구 표의 값으로 다시 계산하세요.**\n\n- 노트북: 노트북에는 해당 셀이 없습니다.\n- 자치구 표로 계산하면 카메라 mean은 `4,644.88`, 설치개소 mean은 `2,121.52`입니다.\n\n---\n\n## p.25 서울시 생활안전 시설물 현황 - 보안등\n\n**→ 평균을 하나로 통일하세요.**\n\n- 노트북: 노트북에는 해당 셀이 없습니다.\n- 불릿은 `약 8,209개`, 기술통계 표는 `8,785.52`인데, 자치구 표로 계산하면 `8,507.52`입니다.\n- `8,209`는 성동구를 예전 값 `223`으로 계산한 평균입니다.\n\n**→ 성동구 설치개소 `30(*)`을 기술통계와 전체 합계에서 빼거나, 이 값이 무엇인지 각주에 적으세요.**\n\n- 노트북: 노트북에는 `30`이 없습니다. `261104 분석노트북` 셀 29는 `223`, `261103 보안등 전처리(2차)` 셀 40의 표는 성동구 원본 행 수 `38`입니다.\n- 각주는 성동구 설치개소 수가 `원본 데이터 상 누락`이라고 하는데, 표에는 `30`이 있고 기술통계 min과 전체 `158,591`에도 들어가 있습니다.\n- 성동구는 보안등 `7,675`대에 개소 `30`곳이라 `1개소당 1.34대` 계산도 왜곡됩니다.\n\n**→ 지도 범례의 최솟값 `223`을 지금 데이터로 다시 그리세요.**\n\n- 노트북: `261104 분석노트북` 셀 28(보안등 지도 이미지)과 셀 29(`성동구(223개)`)입니다.\n- 범례 첫 구간이 `223 - 3074`라 성동구 예전 값으로 색 구간을 만든 것으로 보입니다(확인 필요).\n\n---\n\n## p.26 서울시 생활안전 시설물 현황 - 안전비상벨\n\n**→ 🚨 부제의 `가장 많이 설치된 자치구는 강남구`를 `도봉구`로 고치세요.**\n\n- 노트북: `261104 분석노트북` 셀 32(안전비상벨 지도 해석)입니다. `강남구(1,780개), 도봉구(2,164개)` 순서로 적혀 있습니다.\n- 제목과 표, 첫 불릿은 모두 도봉구 `2,164`개가 1위입니다.\n\n**→ `편차가 다른 시설물에 비해 상대적으로 큼`을 삭제하거나 비교 기준을 적으세요.**\n\n- 노트북: `261104 분석노트북` 셀 104(분석 결과 Q2)입니다. 노트북에서는 `안심지킴이집은 가장 큰 편차`였습니다.\n- 표준편차를 평균으로 나눈 값으로 비교하면 안전비상벨 `0.50`은 안심지킴이집 `0.70`, CCTV `0.57`보다 작습니다.\n  - 단위가 다른 시설물끼리는 표준편차를 그대로 비교할 수 없어서 평균으로 나눠 봐야 합니다.\n\n**→ 기술통계 표의 mean `1,078.56`을 부제의 `1,049`와 맞추세요.**\n\n- 노트북: 노트북에는 해당 셀이 없습니다.\n- 자치구 표로 계산하면 `1,049.36`입니다.\n\n---\n\n## p.27 서울시 생활안전 시설물 현황 - 안심지킴이집\n\n**→ 기술통계 표의 mean `27.44`를 부제의 `평균 29개소`와 맞추세요.**\n\n- 노트북: 노트북에는 해당 셀이 없습니다.\n- 자치구 표로 계산하면 `728 ÷ 25 = 29.12`입니다.\n\n**→ `강남구 및 동대문구와 약 10~15배 차이`를 실제 배율로 고치세요.**\n\n- 노트북: 노트북에는 해당 문장이 없습니다. `261104 분석노트북` 셀 35(안심지킴이집 지도 해석)에는 배율이 없습니다.\n- `108 ÷ 6 = 18배`, `62 ÷ 7 = 8.9배`라 범위는 약 `9~18배`입니다.\n\n---\n\n## p.30 결론\n\n**→ 🚨 Q3의 `2023년 이후 '살인', '강간·강제추행' 등 일부 범죄 유형은 증가`를 삭제하거나 기준 연도와 수치를 붙여 다시 쓰세요.**\n\n- 노트북: `261104 분석노트북` 셀 51(Q3 그래프 해석)과 셀 104(분석 결과 Q3)입니다.\n- p.15 표에서 2023년 → 2025년은 살인 `147 → 124`, 강간·강제추행 `6,098 → 6,007`로 둘 다 줄었습니다.\n- p.15의 `강간·강제추행은 2022년 이후 균등한 수준`과도 어긋납니다(p.15 ↔ p.30).\n\n---\n\n## p.31 결론\n\n**→ 범죄 발생 건수와 '안전하지 않다' 응답 비율을 같은 연도끼리 한 표에 나란히 두세요.**\n\n- 노트북: `261104 분석노트북` 셀 106(주요 결론 첫 문단)입니다.\n- 지금은 두 자료를 글로만 이어 `상반된 양상`을 말하고 있습니다.\n- 예: `2022년 범죄 91,326건 · 안전하지 않음 37.3%`, `2024년 81,710건 · 39.4%`처럼 두 해를 나란히 쓰면 주장을 바로 확인할 수 있습니다.\n  - 양천구를 고친 뒤의 건수로 쓰세요.\n\n---\n\n## p.32 시사점\n\n**→ `안전시설물의 현황을 검토하여 설치 수요를 충족하고 … 시민들의 인식 변화를 유도할 필요`를 `설치가 적은 구를 중심으로 수요를 점검할 필요`까지로 낮추세요.**\n\n- 노트북: `261104 분석노트북` 셀 106(주요 결론)입니다.\n- 시설물이 많은 구에서 범죄나 불안이 적은지는 이 보고서의 어느 그래프에도 없습니다.\n- 바로 아래 문단의 `시설물 설치 대수가 많다고 해서 … 단정하기 어렵다`와도 어긋납니다.\n\n---\n\n## p.36 참고문헌\n\n**→ 참고문헌을 본문의 해당 문장에 인용 표시로 연결하세요.**\n\n- 노트북: `261104 분석노트북` 셀 107(참고문헌)입니다.\n- 학술논문 4편과 보도자료 4건이 본문 어디에도 인용되지 않았습니다.\n- p.5의 사건 서술과 p.15의 코로나19 해석이 이 문헌들에 기대고 있다면 그 자리에 `(노성훈·김병민, 2022)`처럼 적으세요.\n"}));async function Jz(e){let t=Object.entries(eB);if(!t.length)throw Error(`원고 파일을 찾지 못했어요`);if(t.length===1)return t[0][1]();let n=await Promise.all(t.map(async([e,t])=>({path:e,text:await t()})));return(e&&n.find(t=>t.text.includes(`title: ${e}`))||n.find(e=>e.path===`/slides.md`)||n[0]).text}function Yz(e){let t={};for(let n of e.matchAll(/([\w-]+)="([^"]*)"/g))t[n[1]]=n[2];return t}function Xz(e){let t=e.replace(/\r\n?/g,`
